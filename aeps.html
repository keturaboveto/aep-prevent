<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1F3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AEP NR-17 — Minhas AEPs</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito Sans',system-ui,sans-serif;background:#F0F4FA;color:#1A2332;min-height:100vh}
.topbar{background:#1F3864;color:#fff;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.topbar-left{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.topbar-logo{background:#000;border-radius:6px;padding:5px 10px}
.topbar-logo img{height:30px;display:block}
.topbar-title{font-size:14px;font-weight:800}
.topbar-sub{font-size:11px;color:rgba(255,255,255,.6)}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.user-info{font-size:11px;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:5px;padding:5px 10px;background:rgba(255,255,255,.08);border-radius:18px}
.btn-top{padding:6px 13px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;text-decoration:none}
.btn-top:hover{background:rgba(255,255,255,.2)}
.main{max-width:1080px;margin:24px auto;padding:0 16px 40px}
.page-title{font-size:22px;font-weight:800;color:#1F3864;margin-bottom:4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.admin-tag{font-size:10px;font-weight:700;background:#1F3864;color:#fff;padding:2px 8px;border-radius:12px}
.page-sub{font-size:13px;color:#8A96A8;margin-bottom:22px}
.empty-card{background:#fff;border-radius:14px;padding:48px 24px;text-align:center;box-shadow:0 2px 14px rgba(31,56,100,.08)}
.empty-card i{font-size:48px;color:#C8D0DC;display:block;margin-bottom:14px}
.empty-card h3{color:#1F3864;font-size:17px;margin-bottom:6px}
.empty-card p{color:#8A96A8;font-size:13px;margin-bottom:18px}
.btn-new{padding:11px 22px;background:#3B6D11;color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px;transition:opacity .15s}
.btn-new:hover{opacity:.9}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;max-width:340px;min-width:200px}
.search-wrap input{width:100%;padding:9px 12px 9px 36px;border:1.5px solid #DDE2EA;border-radius:9px;font-size:13px;font-family:inherit;color:#1A2332;outline:none;background:#fff}
.search-wrap input:focus{border-color:#185FA5}
.search-wrap i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#8A96A8;font-size:15px}
.filter-info{font-size:11px;color:#8A96A8;display:flex;align-items:center;gap:6px}
.aep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.aep-card{background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(31,56,100,.07);padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;border:2px solid transparent;position:relative;transition:transform .15s,box-shadow .15s}
.aep-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(31,56,100,.13);border-color:#185FA5}
.aep-name{font-size:14px;font-weight:800;color:#1F3864;line-height:1.3;padding-right:34px;word-break:break-word}
.aep-edit{position:absolute;top:13px;right:13px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;color:#8A96A8;background:#F0F4FA;cursor:pointer;border:none}
.aep-edit:hover{background:#185FA5;color:#fff}
.aep-meta{display:flex;flex-direction:column;gap:1px;font-size:11px;color:#4A5568}
.aep-meta .label{color:#8A96A8;font-size:10px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.aep-cnpj{font-family:monospace;font-size:11px;color:#185FA5;font-weight:600}
.aep-dates{display:flex;justify-content:space-between;padding-top:8px;margin-top:auto;border-top:1px solid #EEF2F8;font-size:10px;color:#8A96A8}
.aep-owner{font-size:10px;color:#4A5568;display:flex;align-items:center;gap:4px;background:#F8FAFD;padding:3px 9px;border-radius:12px;align-self:flex-start;border:1px solid #EEF2F8}
.aep-owner.is-mine{background:#EAF3DE;color:#3B6D11;border-color:#C0DD97}
.aep-actions{display:flex;gap:5px;margin-top:8px}
.aep-actions button{flex:1;padding:7px 8px;border:1px solid #DDE2EA;background:#fff;border-radius:6px;font-size:11px;color:#4A5568;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.aep-actions button:hover{background:#F0F4FA;color:#1F3864}
.aep-actions button.open-btn{background:#185FA5;color:#fff;border-color:#185FA5;flex:2}
.aep-actions button.open-btn:hover{background:#1a6bbf;color:#fff}
.aep-actions button.danger:hover{background:#FFF0F0;color:#C0392B;border-color:#f5c6c6}
.empty-search{text-align:center;padding:40px 20px;color:#8A96A8;font-size:13px;background:#fff;border-radius:12px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:22px;max-width:420px;width:100%;box-shadow:0 16px 50px rgba(0,0,0,.3)}
.modal h3{color:#1F3864;font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.modal p{color:#4A5568;font-size:12px;margin-bottom:14px;line-height:1.5}
.modal input{width:100%;padding:10px 12px;border:1.5px solid #DDE2EA;border-radius:7px;font-size:13px;font-family:inherit;color:#1A2332;outline:none;margin-bottom:14px}
.modal input:focus{border-color:#185FA5}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.modal-btns button{padding:9px 18px;border-radius:7px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.modal-btns .cancel{background:#EEF2F8;color:#4A5568}
.modal-btns .ok{background:#1F3864;color:#fff}
.modal-btns .danger{background:#C0392B;color:#fff}
@media(max-width:600px){.aep-grid{grid-template-columns:1fr}.topbar-actions .btn-top span{display:none}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo"><img src="logo-prevent.png" alt="Dr. Prevent"></div>
    <div>
      <div class="topbar-title">AEP NR-17</div>
      <div class="topbar-sub">Dr. Prevent Saúde Ocupacional</div>
    </div>
  </div>
  <div class="topbar-actions">
    <div class="user-info"><i class="ti ti-user-circle"></i> <span id="userInfo"></span></div>
    <a class="btn-top" id="btnAdmin" href="admin.html" style="display:none"><i class="ti ti-settings"></i> <span>Admin</span></a>
    <button class="btn-top" onclick="AEPAuth.logout()"><i class="ti ti-logout"></i> <span>Sair</span></button>
  </div>
</div>

<div class="main">
  <div class="page-title">
    <i class="ti ti-folders"></i> Minhas AEPs
    <span class="admin-tag" id="adminTag" style="display:none">visão admin — todas</span>
  </div>
  <div class="page-sub" id="pageSub">Suas avaliações ergonômicas preliminares</div>
  <div id="content"></div>
</div>

<!-- Modal renomear -->
<div class="modal-bg" id="modalRename">
  <div class="modal">
    <h3><i class="ti ti-edit"></i> Renomear AEP</h3>
    <p>Escolha um nome para identificar esta avaliação.</p>
    <input id="renameInput" placeholder="Ex.: Indústria São João — Costura" maxlength="120">
    <div class="modal-btns">
      <button class="cancel" onclick="closeModal('modalRename')">Cancelar</button>
      <button class="ok" onclick="salvarNome()">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal excluir -->
<div class="modal-bg" id="modalDelete">
  <div class="modal">
    <h3 style="color:#C0392B"><i class="ti ti-alert-triangle"></i> Excluir AEP?</h3>
    <p id="deleteText">Esta ação não pode ser desfeita.</p>
    <div class="modal-btns">
      <button class="cancel" onclick="closeModal('modalDelete')">Cancelar</button>
      <button class="danger" onclick="confirmarExclusao()">Sim, excluir</button>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script src="aeps.js"></script>
<script>
const session = AEPAuth.requireAuth();
let acaoId = null;

if(session){
  document.getElementById('userInfo').textContent = session.nome || session.user;
  if(session.role==='admin'){
    document.getElementById('btnAdmin').style.display='inline-flex';
    document.getElementById('adminTag').style.display='inline-block';
    document.getElementById('pageSub').textContent = 'Como administrador, você visualiza todas as AEPs do sistema.';
  }
  AEPStore.clearCurrentId();
}

function fmtData(ts){ return ts ? new Date(ts).toLocaleDateString('pt-BR') : '—'; }
function escHTML(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }

function novaAEP(){
  const id = AEPStore.create(session);
  AEPStore.setCurrentId(id);
  window.location.href = 'index.html';
}
function abrirAEP(id){
  AEPStore.setCurrentId(id);
  window.location.href = 'index.html';
}
function duplicarAEP(id){
  if(AEPStore.duplicate(id, session)) render();
}
function pedirExclusao(id, nome){
  acaoId = id;
  document.getElementById('deleteText').textContent = `Tem certeza que deseja excluir "${nome}"? Esta ação não pode ser desfeita.`;
  openModal('modalDelete');
}
function confirmarExclusao(){
  if(acaoId){ AEPStore.remove(acaoId); acaoId=null; closeModal('modalDelete'); render(); }
}
function pedirRenomear(id, nome){
  acaoId = id;
  document.getElementById('renameInput').value = nome;
  openModal('modalRename');
  setTimeout(()=>document.getElementById('renameInput').focus(),80);
}
function salvarNome(){
  const novo = document.getElementById('renameInput').value.trim();
  if(acaoId && novo){
    AEPStore.rename(acaoId, novo);
    acaoId = null;
    closeModal('modalRename');
    render();
  }
}
document.getElementById('renameInput').addEventListener('keydown',e=>{ if(e.key==='Enter') salvarNome(); });

function render(){
  const lista = AEPStore.listForUser(session);
  const termo = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
  const filtrada = termo ? lista.filter(a =>
    (a.nome||'').toLowerCase().includes(termo) ||
    (a.empresa||'').toLowerCase().includes(termo) ||
    (a.cnpj||'').toLowerCase().includes(termo) ||
    (a.ownerNome||'').toLowerCase().includes(termo)
  ) : lista;

  const content = document.getElementById('content');

  if(lista.length === 0){
    content.innerHTML = `
      <div class="empty-card">
        <i class="ti ti-clipboard-plus"></i>
        <h3>${session.role==='admin'?'Nenhuma AEP no sistema':'Você ainda não criou nenhuma AEP'}</h3>
        <p>Crie sua primeira avaliação ergonômica preliminar para começar.</p>
        <button class="btn-new" onclick="novaAEP()"><i class="ti ti-plus"></i> Criar primeira AEP</button>
      </div>`;
    return;
  }

  const toolbar = `
    <div class="toolbar">
      <div class="search-wrap">
        <i class="ti ti-search"></i>
        <input id="searchInput" type="text" placeholder="Buscar por nome, empresa, CNPJ${session.role==='admin'?', técnico':''}..." value="${escHTML(termo)}" oninput="render()">
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <span class="filter-info"><i class="ti ti-files"></i> ${filtrada.length} de ${lista.length} AEP${lista.length!==1?'s':''}</span>
        <button class="btn-new" onclick="novaAEP()"><i class="ti ti-plus"></i> Nova AEP</button>
      </div>
    </div>`;

  if(filtrada.length === 0){
    content.innerHTML = toolbar + `<div class="empty-search"><i class="ti ti-search" style="font-size:24px;display:block;margin-bottom:8px"></i>Nenhuma AEP encontrada</div>`;
    return;
  }

  const cards = filtrada.map(a => {
    const isMine = a.owner === session.user;
    return `
    <div class="aep-card" onclick="abrirAEP('${a.id}')">
      <div class="aep-name">${escHTML(a.nome)}
        <button class="aep-edit" onclick="event.stopPropagation();pedirRenomear('${a.id}','${escHTML(a.nome)}')" title="Editar nome">
          <i class="ti ti-pencil" style="font-size:13px"></i>
        </button>
      </div>
      ${a.empresa?`<div class="aep-meta"><span class="label">Empresa</span><span>${escHTML(a.empresa)}</span></div>`:''}
      ${a.cnpj?`<div class="aep-meta"><span class="label">CNPJ</span><span class="aep-cnpj">${escHTML(a.cnpj)}</span></div>`:''}
      ${session.role==='admin' ? `<div class="aep-owner ${isMine?'is-mine':''}"><i class="ti ti-user" style="font-size:11px"></i> ${escHTML(a.ownerNome||a.owner)}${isMine?' (você)':''}</div>` : ''}
      <div class="aep-dates">
        <span><i class="ti ti-plus" style="font-size:11px"></i> ${fmtData(a.criadoEm)}</span>
        <span><i class="ti ti-edit" style="font-size:11px"></i> ${fmtData(a.atualizadoEm)}</span>
      </div>
      <div class="aep-actions" onclick="event.stopPropagation()">
        <button class="open-btn" onclick="abrirAEP('${a.id}')"><i class="ti ti-folder-open"></i> Abrir</button>
        <button onclick="duplicarAEP('${a.id}')" title="Duplicar"><i class="ti ti-copy"></i></button>
        <button class="danger" onclick="pedirExclusao('${a.id}','${escHTML(a.nome)}')" title="Excluir"><i class="ti ti-trash"></i></button>
      </div>
    </div>`;
  }).join('');

  content.innerHTML = toolbar + `<div class="aep-grid">${cards}</div>`;
}

render();

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
